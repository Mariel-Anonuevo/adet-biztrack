<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizTrack - Create Account</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/auth.css?v=5">
</head>
<body class="auth-body">

<div class="auth-container">
    <!-- Left Green Panel -->
    <div class="auth-left">
        <!-- Exact SVG Logo Recreation -->
        <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <rect x="0" y="55" width="14" height="45" fill="#1b2e4b" rx="2" />
            <rect x="20" y="45" width="14" height="55" fill="#1b2e4b" rx="2" />
            <rect x="40" y="35" width="14" height="65" fill="#ffffff" rx="2" />
            <rect x="60" y="25" width="14" height="75" fill="#1b2e4b" rx="2" />
            <rect x="80" y="10" width="14" height="90" fill="#1b2e4b" rx="2" />
            
            <path d="M 5 60 L 30 35 L 50 45 L 85 5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
            <circle cx="5" cy="60" r="3" fill="#ffffff" />
            <polygon points="80,5 90,5 88,15" fill="#ffffff" />
        </svg>
        
        <div class="logo-title">BizTrack</div>
        <div class="logo-subtitle">Business Intelligence</div>
    </div>

    <!-- Right Form Panel -->
    <div class="auth-right">
        <div class="auth-card" style="box-shadow: none; padding-top: 1rem;">
            <h1 class="auth-title" style="text-align: left;">Create account</h1>
            <p class="auth-subtitle" style="text-align: left;">Join thousands of businesses optimizing their growth path.</p>

            <form id="registerForm">
                <div id="errorAlert" style="display:none; color: #dc3545; background: #f8d7da; padding: 10px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1rem;"></div>

                <label class="auth-label">Username</label>
                <div class="auth-input-group">
                    <i class="fa-regular fa-user auth-input-icon"></i>
                    <input type="text" id="fullName" class="auth-input" placeholder="username" required>
                </div>

                <label class="auth-label">Email Address</label>
                <div class="auth-input-group">
                    <i class="fa-regular fa-envelope auth-input-icon"></i>
                    <input type="email" id="email" class="auth-input" placeholder="user@gmail.com" pattern="[a-zA-Z0-9._%+-]+@gmail\.com" required>
                </div>

                <label class="auth-label">Password</label>
                <div class="auth-input-group">
                    <i class="fa-solid fa-lock auth-input-icon"></i>
                    <input type="password" id="password" class="auth-input" placeholder="••••••••" required>
                    <i class="fa-regular fa-eye auth-input-icon auth-toggle-password" id="togglePassword" role="button" aria-label="Show password" tabindex="0"></i>
                </div>

                <label class="auth-label">Confirm Password</label>
                <div class="auth-input-group">
                    <i class="fa-solid fa-shield-halved auth-input-icon"></i>
                    <input type="password" id="confirmPassword" class="auth-input" placeholder="••••••••" required>
                    <i class="fa-regular fa-eye auth-input-icon auth-toggle-password" id="toggleConfirmPassword" role="button" aria-label="Show confirm password" tabindex="0"></i>
                </div>

                <div id="passwordChecklist" style="margin-top: 0.5rem; margin-bottom: 1.5rem; background-color: rgba(0,0,0,0.02); padding: 12px 16px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.05); display: none;">
                    <div style="font-size: 0.72rem; font-weight: 700; color: #6c757d; margin-bottom: 0.5rem; letter-spacing: 0.5px; text-transform: uppercase;">Password Requirements:</div>
                    <ul style="list-style: none; padding-left: 0; margin-bottom: 0; font-size: 0.72rem; line-height: 1.6;">
                        <li id="reqLength" style="color: #dc3545; transition: color 0.2s;"><i class="fa-solid fa-xmark me-1" style="margin-right: 4px;"></i> At least 8 characters long</li>
                        <li id="reqComplexity" style="color: #dc3545; transition: color 0.2s;"><i class="fa-solid fa-xmark me-1" style="margin-right: 4px;"></i> Uppercase, number & special character</li>
                    </ul>
                </div>

                <div style="margin-bottom: 2rem;">
                    <label class="auth-checkbox-container">
                        <input type="checkbox" required>
                        <span>I agree to the <a href="#" class="auth-link">Terms of Service</a> and <a href="#" class="auth-link">Privacy Policy</a>.</span>
                    </label>
                </div>

                <button type="submit" class="auth-btn" id="submitBtn">
                    <span class="btn-text">Create account <i class="fa-solid fa-arrow-right ms-2" style="margin-left: 5px;"></i></span>
                    <span class="spinner"></span>
                </button>
            </form>

            <div class="auth-footer" style="margin-top: 3rem;">
                Already have an account? <a href="/auth/login" class="auth-link">Sign In</a>
            </div>
            
            <div style="text-align: center; margin-top: 3rem; font-size: 0.65rem; color: #ced4da; letter-spacing: 1px;">
                POWERED BY BIZTRACK PRO INFRASTRUCTURE
            </div>
        </div>
    </div>
</div>

<script src="/static/js/auth.js"></script>
</body>
</html>
