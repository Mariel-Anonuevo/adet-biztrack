{% extends "base.html" %}

{% block content %}
<!-- Header -->
<div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
    <h3 class="fw-bold mb-0 page-title">Reports</h3>
    <div class="d-flex align-items-center gap-3">
        <button class="btn btn-sm btn-ai-badge rounded-pill d-flex align-items-center gap-1">
            <i class="fa-solid fa-wand-magic-sparkles"></i> AI Active
        </button>
        <div class="user-avatar rounded-circle d-flex align-items-center justify-content-center text-white fw-bold">
            {{ request.state.user.full_name[0] | upper }}
        </div>
    </div>
</div>

<div class="row g-4">
    <div class="col-12">
        <div class="bg-dark-card p-4" style="border-radius:12px;">
            <h5 class="fw-bold mb-1">Generate financial report</h5>
            <p class="page-subtitle mb-4">Select month to compile</p>
            <div class="d-flex align-items-center gap-3">
                <div class="flex-grow-1" style="max-width: 400px;">
                    <label class="form-label small text-secondary mb-1">Report month</label>
                    <select class="form-select custom-select py-2 rounded-3 shadow-sm w-100">
                        <option selected>May 2026</option>
                        <option>April 2026</option>
                    </select>
                </div>
                <div class="align-self-end">
                    <button class="btn d-inline-flex align-items-center gap-2 px-4 py-2 rounded-3 custom-export-btn">
                        <i class="fa-regular fa-file-pdf"></i> Generate
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="col-12">
        <div class="bg-dark-card p-4" style="border-radius:12px;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="fw-bold mb-0">Historical records</h5>
                <span class="page-subtitle">Filter and search past entries</span>
            </div>

            <input type="text" class="form-control py-3 px-4 rounded-3 shadow-sm w-100 mb-4" placeholder="Search entries...">

            <div class="table-responsive">
                <table class="table table-hover mb-0 custom-table align-middle">
                    <thead class="table-header">
                        <tr>
                            <th class="ps-4">Month</th>
                            <th>Type</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody id="reportsTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/reports.js"></script>
{% endblock %}
